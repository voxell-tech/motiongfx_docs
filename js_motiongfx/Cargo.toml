[package]
name = "js_motiongfx"
description = "MotionGfx runtime for JavaScript and TypeScript, compiled to wasm."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Fixed to a released version, not a path/git dependency: this crate
# lives outside the motiongfx workspace now, and the docs site should
# track a real release, not whatever's mid-development there.
motiongfx = "0.3.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
# Wraps captured JS closures so they satisfy `Action<T>`'s `Send + Sync`
# bound; see src/lib.rs for why that's sound here.
send_wrapper = "0.6"
